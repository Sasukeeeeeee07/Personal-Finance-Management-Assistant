name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pfm, POSTGRES_PASSWORD: pfm, POSTGRES_DB: pfm }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pfm" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Migrations apply on real PostgreSQL
        run: npm run migrate
        env: { DATABASE_URL: "postgres://pfm:pfm@localhost:5432/pfm" }
      - run: npm run build
